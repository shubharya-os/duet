name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Every bug found in this project so far came from the machine, not the
    # logic: a shadowed interpreter, a tool that was not on PATH, a command
    # that only resolved from one directory. One OS in CI would not have seen
    # any of them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # Keep the matrix small: the middle version on one OS is enough to
          # catch anything the other two would.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      # install.sh's POSIX-sh guarantee is only as good as what actually
      # exercises it: tests/test_install_sh.py skips dash and shellcheck when
      # they are absent, so without this step the guarantee held on ubuntu by
      # luck (its default image happens to ship both) and not at all on macOS.
      - name: dash and shellcheck, so install.sh's POSIX checks cannot silently skip
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dash shellcheck
      - name: dash and shellcheck, so install.sh's POSIX checks cannot silently skip
        if: matrix.os == 'macos-latest'
        run: brew install dash shellcheck
      - name: tests
        run: pytest -q
      - name: a plain install provides the duet command
        run: |
          python -m venv /tmp/plain
          /tmp/plain/bin/pip install --quiet .
          /tmp/plain/bin/duet --version
      - name: the loop runs end to end
        run: duet demo --quiet
      - name: doctor reports honestly with nothing connected
        run: duet doctor || test $? -eq 1
